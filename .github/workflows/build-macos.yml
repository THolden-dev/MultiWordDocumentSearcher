name: Build macOS WordDocumentSearcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        rid:
          - osx-arm64
          - osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -o out

      - name: Create .app bundle
        run: |
          APP_NAME="WordDocumentSearcher"
          APP_DIR="$APP_NAME.app"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp -R out/* "$APP_DIR/Contents/MacOS/"

          cat > "$APP_DIR/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>WordDocumentSearcher</string>
              <key>CFBundleDisplayName</key>
              <string>WordDocumentSearcher</string>
              <key>CFBundleExecutable</key>
              <string>WordDocumentSearcher</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourcompany.worddocumentsearcher</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF

          chmod +x "$APP_DIR/Contents/MacOS/WordDocumentSearcher"

      - name: Zip app
        run: |
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then
            zip -r WordDocumentSearcher-mac-arm64.zip WordDocumentSearcher.app
          else
            zip -r WordDocumentSearcher-mac-x64.zip WordDocumentSearcher.app
          fi

      - name: Upload ARM64 artifact
        if: matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: WordDocumentSearcher-mac-arm64
          path: WordDocumentSearcher-mac-arm64.zip

      - name: Upload x64 artifact
        if: matrix.rid == 'osx-x64'
        uses: actions/upload-artifact@v4
        with:
          name: WordDocumentSearcher-mac-x64
          path: WordDocumentSearcher-mac-x64.zip