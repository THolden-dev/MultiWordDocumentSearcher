name: Build macOS WordDocumentSearcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -r osx-arm64 --self-contained true -o out

      - name: Create .app bundle
        run: |
          APP_NAME="WordDocumentSearcher"
          APP_DIR="$APP_NAME.app"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp -R out/* "$APP_DIR/Contents/MacOS/"

          cat <<EOF > "$APP_DIR/Contents/Info.plist"
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>WordDocumentSearcher</string>

    <key>CFBundleDisplayName</key>
    <string>WordDocumentSearcher</string>

    <key>CFBundleExecutable</key>
    <string>WordDocumentSearcher</string>

    <key>CFBundleIdentifier</key>
    <string>com.yourcompany.worddocumentsearcher</string>

    <key>CFBundlePackageType</key>
    <string>APPL</string>

    <key>CFBundleVersion</key>
    <string>1.0</string>
</dict>
</plist>
EOF

          chmod +x "$APP_DIR/Contents/MacOS/WordDocumentSearcher"

      - name: Zip app
        run: zip -r WordDocumentSearcher-mac.zip WordDocumentSearcher.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: WordDocumentSearcher-mac.zip